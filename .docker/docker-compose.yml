version: '3.8'

services:
  leantime_db:
    image: mysql:8.0
    container_name: leantime_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_DATABASE: leantime
      MYSQL_USER: leantime_user
      MYSQL_PASSWORD: leantime_password
    volumes:
      - leantime_db_data:/var/lib/mysql

  leantime_app:
    image: leantime/leantime:latest
    container_name: leantime_app
    restart: always
    ports:
      - "80:80"
    environment:
      - LEAN_DB_HOST=leantime_db
      - LEAN_DB_USER=leantime_user
      - LEAN_DB_PASSWORD=leantime_password
      - LEAN_DB_DATABASE=leantime
      - LEAN_APP_URL=https://your-domain.com
    depends_on:
      - leantime_db
    volumes:
      - leantime_user_data:/var/www/html/userfiles
      - leantime_public_data:/var/www/html/public/uploads

volumes:
  leantime_db_data:
  leantime_user_data:
  leantime_public_data:
