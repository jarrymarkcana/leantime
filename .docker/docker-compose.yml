version: '3.8'

services:
  leantime_app:
    image: leantime/leantime:latest
    container_name: leantime_app
    restart: always
    ports:
      - "80:80"
    networks:
      - default
      - neondb_network  # Joins Leantime to your existing NeonDB network
    environment:
      # Database Connection
      - LEAN_DB_HOST=openship-neon-db-service # See notes below if this fails
      - LEAN_DB_PORT=8220
      - LEAN_DB_DATABASE=leantime
      - LEAN_DB_USER=jarrymark.cana@mlhuillier.com      # PLUG IN YOUR USERNAME
      - LEAN_DB_PASSWORD=Mlinc123456@  # PLUG IN YOUR PASSWORD
      
      # Local App Configuration
      - LEAN_APP_URL=http://desktophotg248.mlhuillier.local
    volumes:
      - leantime_user_data:/var/www/html/userfiles
      - leantime_public_data:/var/www/html/public/uploads

volumes:
  leantime_user_data:
  leantime_public_data:

networks:
  default:
  neondb_network:
    external: true
    name: openship-neon  # Uses your existing OpenShip network
